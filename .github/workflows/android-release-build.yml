name: Build Android release

on:
  create:
  workflow_dispatch:

permissions:
  # Creates the release tag and uploads the APK and AAB to its GitHub Release.
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android APK and AAB
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.ref_type == 'branch' &&
      (github.ref_name == 'release' || startsWith(github.ref_name, 'release/')))
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out release branch
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.1
          channel: stable
          cache: true

      - name: Configure Firebase
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
          ENV_FILE_BASE64: ${{ secrets.ENV_FILE_BASE64 }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON_BASE64"
          test -n "$FIREBASE_OPTIONS_DART_BASE64"
          umask 077
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          printf '%s' "$FIREBASE_OPTIONS_DART_BASE64" | base64 --decode > lib/firebase_options.dart
          test -s android/app/google-services.json
          test -s lib/firebase_options.dart
          printf '%s' "$ENV_FILE_BASE64" | base64 --decode > .env
          test -s .env

      - name: Install dependencies
        run: flutter pub get

      - name: Read Android version
        id: android_version
        shell: bash
        run: |
          version=$(sed -nE 's/^android_version:[[:space:]]*([^[:space:]#]+).*/\1/p' pubspec.yaml)
          test -n "$version"
          [[ "$version" =~ ^[0-9]+(\.[0-9]+){2}\+[0-9]+$ ]]

          echo "name=${version%%+*}" >> "$GITHUB_OUTPUT"
          echo "number=${version##*+}" >> "$GITHUB_OUTPUT"

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_STORE_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          printf 'storeFile=upload-keystore.jks\nkeyAlias=%s\nkeyPassword=%s\nstorePassword=%s\n' \
            "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" "$ANDROID_STORE_PASSWORD" > android/key.properties

      - name: Build Android APK
        run: >-
          flutter build apk --release
          --build-name=${{ steps.android_version.outputs.name }}
          --build-number=${{ steps.android_version.outputs.number }}

      - name: Build Android App Bundle
        run: >-
          flutter build appbundle --release
          --build-name=${{ steps.android_version.outputs.name }}
          --build-number=${{ steps.android_version.outputs.number }}

      - name: Publish GitHub release (draft)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.android_version.outputs.name }}
          VERSION_NUMBER: ${{ steps.android_version.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          base="android-v${VERSION_NAME}-${VERSION_NUMBER}"
          title="Android ${VERSION_NAME} (${VERSION_NUMBER})"

          # A draft release only creates its git tag when it is published, so
          # a name is taken if either the tag or a release (draft included)
          # already uses it.
          taken() {
            git ls-remote --exit-code --tags origin "refs/tags/$1" >/dev/null 2>&1 ||
              gh release view "$1" >/dev/null 2>&1
          }

          tag="$base"
          if taken "$tag"; then
            stamp=$(date -u +%Y%m%d-%H%M%S)
            tag="${base}-${stamp}"
            title="${title} · $(date -u '+%Y-%m-%d %H:%M') UTC"
          fi

          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk "release/picell-${VERSION_NAME}-${VERSION_NUMBER}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "release/picell-${VERSION_NAME}-${VERSION_NUMBER}.aab"

          # Drafts are visible to collaborators only until published by hand.
          gh release create "$tag" release/* \
            --draft \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --generate-notes
          echo "Draft release ${tag}: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases" >> "$GITHUB_STEP_SUMMARY"
